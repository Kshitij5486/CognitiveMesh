networks:
  cognitivemesh-net:
    driver: bridge

volumes:
  pg-node1-data:
  pg-node2-data:
  pg-node3-data:
  zookeeper-data:
  kafka-data:

services:

  pg-node1:
    image: postgres:15
    container_name: cm-pg-node1
    environment:
      POSTGRES_USER: cm_user
      POSTGRES_PASSWORD: cm_secret
      POSTGRES_DB: cm_node1
    ports:
      - "5436:5432"
    volumes:
      - pg-node1-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cognitivemesh-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cm_user -d cm_node1"]
      interval: 10s
      timeout: 5s
      retries: 5

  pg-node2:
    image: postgres:15
    container_name: cm-pg-node2
    environment:
      POSTGRES_USER: cm_user
      POSTGRES_PASSWORD: cm_secret
      POSTGRES_DB: cm_node2
    ports:
      - "5437:5432"
    volumes:
      - pg-node2-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cognitivemesh-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cm_user -d cm_node2"]
      interval: 10s
      timeout: 5s
      retries: 5

  pg-node3:
    image: postgres:15
    container_name: cm-pg-node3
    environment:
      POSTGRES_USER: cm_user
      POSTGRES_PASSWORD: cm_secret
      POSTGRES_DB: cm_node3
    ports:
      - "5438:5432"
    volumes:
      - pg-node3-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cognitivemesh-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cm_user -d cm_node3"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: cm-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - cognitivemesh-net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | timeout 2 bash -c 'cat > /dev/tcp/localhost/2181' && echo imok"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: cm-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: cm-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9093,PLAINTEXT_INTERNAL://cm-kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_METADATA_MAX_AGE_MS: 10000
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - cognitivemesh-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server cm-kafka:29092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s